# Server Configuration
server.port=9000

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_support_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Health checks - simple UP status
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Spring AI - Set dummy key for now (will be replaced with real key later)
spring.ai.openai.api-key=sk-dummy-key-for-now

# Disable Spring AI autoconfiguration (not needed for auth)
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

# Logging
logging.level.root=WARN
logging.level.com.customersupport=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security.web=DEBUG

# Application Name
spring.application.name=Customer Support API

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Session Configuration - Allow cross-origin cookies
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
