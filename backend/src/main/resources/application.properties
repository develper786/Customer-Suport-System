# Server Configuration
server.port=9000

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/customer_support_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Health checks - simple UP status
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Spring AI - Set dummy key for now (will be replaced with real key later)
spring.ai.openai.api-key=sk-dummy-key-for-now

# Disable Spring AI autoconfiguration (not needed for auth)
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

# Logging - Security events
logging.level.root=WARN
logging.level.com.customersupport=DEBUG
logging.level.com.customersupport.controller=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.web=WARN

# Log authentication events to file (for audit trail)
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# Application Name
spring.application.name=Customer Support API

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Session Configuration - Allow cross-origin cookies
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# Email Ingestion Configuration
email.ingestion.enabled=true
email.ingestion.webhook-token=${SENDGRID_WEBHOOK_TOKEN:}
email.ingestion.support-email=${SUPPORT_EMAIL:support@example.com}
email.ingestion.auto-categorize=true
email.ingestion.auto-reply-enabled=false
email.ingestion.max-attachment-size-mb=25

# Default Credentials Configuration (can be overridden via environment variables)
app.default-credentials.admin.username=${ADMIN_USERNAME:admin}
app.default-credentials.admin.password=${ADMIN_PASSWORD:admin123}
app.default-credentials.admin.role=${ADMIN_ROLE:ROLE_ADMIN}
app.default-credentials.support.username=${SUPPORT_USERNAME:support}
app.default-credentials.support.password=${SUPPORT_PASSWORD:support123}
app.default-credentials.support.role=${SUPPORT_ROLE:ROLE_AGENT}
