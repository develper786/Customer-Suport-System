# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Spring AI Configuration (must match main properties to avoid autoconfiguration errors)
spring.ai.openai.api-key=sk-dummy-key-for-test
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

# Logging
logging.level.root=WARN
logging.level.com.customersupport=WARN

# Default Credentials Configuration

app.default-credentials.admin.username=admin

app.default-credentials.admin.password=admin123

app.default-credentials.admin.role=ROLE_ADMIN

app.default-credentials.support.username=support

app.default-credentials.support.password=support123

app.default-credentials.support.role=ROLE_AGENT
